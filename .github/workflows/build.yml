name: Build AudioStickers APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - run: unzip -q AudioStickers_Android_Proyecto.zip -d source

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: cd source/AudioStickers_Android && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AudioStickers-APK
          path: source/AudioStickers_Android/app/build/outputs/apk/debug/app-debug.apk
